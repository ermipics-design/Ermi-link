name: Build ERMI LINK Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          unzip -q ERMI-LINK-PLAY-READY.zip
          echo "===== After unzip ====="
          ls -la
          find . -maxdepth 3 -type d

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: |
          find . -name "gradlew" -exec chmod +x {} \;
          find . -name "gradlew"

      - name: Build Release AAB
        run: |
          # Find where gradlew is
          GRADLEW=$(find . -name "gradlew" | head -1)
          echo "Using gradlew at: $GRADLEW"
          cd $(dirname $GRADLEW)
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Find all AAB and APK files
        run: |
          echo "===== Searching for AAB/APK ====="
          find . -name "*.aab" -o -name "*.apk" | head -20
          echo ""
          echo "===== Full tree of build folders ====="
          find . -type d -name "build" | head -10
          find . -path "*/outputs/*" | head -30

      - name: Upload any found artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ERMI-LINK-release
          path: |
            **/*.aab
            **/*.apk
          if-no-files-found: warn
