name: Check Project Structure

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List project structure
        run: |
          echo "===== Root ====="
          ls -la
          echo ""
          echo "===== Looking for Android files ====="
          find . -name "build.gradle*" -o -name "settings.gradle*" -o -name "AndroidManifest.xml" | head -30
          echo ""
          echo "===== app folder ====="
          ls -la app 2>/dev/null || echo "No app folder found"
